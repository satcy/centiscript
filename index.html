<script>
	require.config({ paths: { 'vs': 'lib/monaco-editor/min/vs' }});
	require(['vs/editor/editor.main'], function() {
    monaco.languages.register({ id: 'centi' });
		CENTI.editor = monaco.editor.create(document.getElementById('editor'), {
			value: [
        'sz(720,360)bg(0)\nframe(){\nclr()col(170)\nvl=(h/2)w2=(w/3)\nfor(i,0,w2){\ncol((cos(c*0.01+i*0.25)/2+0.5)*255)\nx=(i*3)y=(cy)\nline(x+cos(c*0.021+i*0.07)*vl,y+sin(c*0.021+i*0.11)*vl/3,x+sin(c*0.02+i*0.11)*vl/3,y+cos(c*0.02+i*0.15)*vl)\n}\n}'
			].join('\n'),
            theme: 'vs-dark',
            fontSize: 14,
            automaticLayout: true,
            scrollbar: {verticalScrollbarSize: 20,  horizontalScrollbarSize:10},
			language: 'centiscript'
		});
    CENTI.editor.onKeyUp(function(event) {
      CENTI.strlength(CENTI.editor.getValue());
    });
	});
</script>
<script>
(function(){
  var divider = document.getElementById('paneDivider');
  var editorPane = document.querySelector('.editor_pane');
  var appMain = document.querySelector('.app_main');
  var dragging = false;
  var lastIsColumn = null;

  function clientXOf(e){
    return e.touches ? e.touches[0].clientX : e.clientX;
  }
  function clientYOf(e){
    return e.touches ? e.touches[0].clientY : e.clientY;
  }

  function isColumnLayout(){
    return getComputedStyle(appMain).flexDirection === 'column';
  }

  function syncModeReset(){
    var col = isColumnLayout();
    if ( lastIsColumn !== null && col !== lastIsColumn ) {
      if ( col ) editorPane.style.width = '';
      else editorPane.style.height = '';
    }
    lastIsColumn = col;
  }

  function onMove(e){
    if ( !dragging ) return;
    var rect = appMain.getBoundingClientRect();
    if ( isColumnLayout() ) {
      var minHeight = 120;
      var maxHeight = rect.height - 120;
      var newHeight = clientYOf(e) - rect.top;
      if ( newHeight < minHeight ) newHeight = minHeight;
      if ( newHeight > maxHeight ) newHeight = maxHeight;
      editorPane.style.height = newHeight + 'px';
    } else {
      var minWidth = 280;
      var maxWidth = rect.width - 280;
      var newWidth = clientXOf(e) - rect.left;
      if ( newWidth < minWidth ) newWidth = minWidth;
      if ( newWidth > maxWidth ) newWidth = maxWidth;
      editorPane.style.width = newWidth + 'px';
    }
    e.preventDefault();
  }

  function onUp(){
    if ( !dragging ) return;
    dragging = false;
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  }

  function onDown(e){
    dragging = true;
    document.body.style.cursor = isColumnLayout() ? 'row-resize' : 'col-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  }

  divider.addEventListener('mousedown', onDown, false);
  window.addEventListener('mousemove', onMove, false);
  window.addEventListener('mouseup', onUp, false);

  divider.addEventListener('touchstart', onDown, {passive:false});
  window.addEventListener('touchmove', onMove, {passive:false});
  window.addEventListener('touchend', onUp, false);

  window.addEventListener('resize', syncModeReset, false);
  syncModeReset();
})();
</script>
