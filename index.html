<script src="lib/monaco-editor/min/vs/loader.js"></script>
<script>
	require.config({ paths: { 'vs': 'lib/monaco-editor/min/vs' }});
	require(['vs/editor/editor.main'], function() {
    monaco.languages.register({ id: 'centi' });
		CENTI.editor = monaco.editor.create(document.getElementById('editor'), {
			value: [
        'sz(720,360)bg(0)\nframe(){\nclr()col(170)\nvl=(h/2)w2=(w/3)\nfor(i,0,w2){\ncol((cos(c*0.01+i*0.25)/2+0.5)*255)\nx=(i*3)y=(cy)\nline(x+cos(c*0.021+i*0.07)*vl,y+sin(c*0.021+i*0.11)*vl/3,x+sin(c*0.02+i*0.11)*vl/3,y+cos(c*0.02+i*0.15)*vl)\n}\n}'
			].join('\n'), 
            theme: 'vs-dark',
            fontSize: 14,
            automaticLayout: true,
            scrollbar: {verticalScrollbarSize: 10,  horizontalScrollbarSize:10},
			language: 'centiscript'
		});
    CENTI.editor.onKeyUp(function(event) {
      CENTI.strlength(CENTI.editor.getValue());
    });
	});
</script>
